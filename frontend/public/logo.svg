<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0066ff" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004cd8" />
      <stop offset="100%" stop-color="#002266" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f6ff" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Frame -->
  <path
    d="M 100 18 
       L 158 43 
       C 158 92 150 133 100 172 
       C 50 133 42 92 42 43 
       Z"
    fill="none"
    stroke="#00388d"
    stroke-width="12"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Stylized F Character -->
  <path
    d="M 68 56
       L 134 56
       C 140 56 142 59 139 65
       L 133 74
       C 131 77 127 78 122 78
       L 87 78
       L 87 91
       L 112 91
       C 117 91 119 94 117 99
       L 114 105
       C 112 108 108 110 104 110
       L 87 110
       L 87 136
       C 87 141 83 144 78 144
       L 76 144
       C 71 144 68 140 68 135
       Z"
    fill="#002b66"
  />

  <!-- Magnifying Glass Handle -->
  <line
    x1="151"
    y1="133"
    x2="175"
    y2="157"
    stroke="#0066ff"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Magnifying Glass Lens Outer Circle -->
  <circle
    cx="134"
    cy="116"
    r="27"
    fill="url(#lensGrad)"
    stroke="#0066ff"
    stroke-width="9"
  />

  <!-- Warning Triangle inside Lens -->
  <path
    d="M 134 101
       L 147 124
       C 148 126 147 127 144 127
       L 124 127
       C 121 127 120 126 121 124
       Z"
    fill="#002b66"
    stroke="#002b66"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Exclamation Mark inside Warning Triangle -->
  <line
    x1="134"
    y1="109"
    x2="134"
    y2="118"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
  />
  <circle
    cx="134"
    cy="123"
    r="1.6"
    fill="#ffffff"
  />
</svg>
